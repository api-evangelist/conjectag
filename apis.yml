name: Conjectag
description: Conjectag (Conject AG / Conject Holding GmbH) was a Munich-based German construction technology company
  founded in 2000 that provided cloud-based software for the built environment, covering project management, collaboration,
  document control, and construction cost management for the AEC (architecture, engineering, and construction) sector.
  It was surfaced as a historical Earlybird Venture Capital portfolio company. Conject was acquired by the Australian
  construction collaboration platform Aconex in March 2016, and Aconex was subsequently acquired by Oracle in December
  2017; the company no longer operates independently and publishes no live website or developer/API surface. This
  profile is retained for network provenance rather than active enrichment.
